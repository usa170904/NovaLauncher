name: Build APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'build-tools;35.0.0 platforms;android-35 ndk;26.1.10909125 cmdline-tools;latest'
      
      - name: Clear npm cache
        run: npm cache clean --force
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --maxsockets=5
        env:
          npm_config_fetch_timeout: 300000
          npm_config_read_timeout: 300000
          npm_config_loglevel: verbose
        timeout-minutes: 20
      
      - name: Verify dependencies installed
        run: |
          echo "=== Checking critical dependencies ==="
          if [ ! -d "node_modules/@react-native/gradle-plugin" ]; then
            echo "❌ ERROR: @react-native/gradle-plugin not found!"
            echo "=== Available @react-native modules ==="
            ls -la node_modules/@react-native/ || echo "No @react-native directory"
            exit 1
          fi
          echo "✓ @react-native/gradle-plugin found"
          echo "✓ All critical dependencies present"
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Setup Gradle
        run: cd android && ./gradlew --version
      
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug -x lint --scan
        timeout-minutes: 30
      
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease -x lint --scan
        timeout-minutes: 30
      
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      
      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
      
      - name: Upload Release Assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
