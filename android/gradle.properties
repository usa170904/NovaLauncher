# Project-wide Gradle settings
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines where memory is limited.
org.gradle.jvmargs=-Xmx2048m -Xms512m
org.gradle.parallel=true
org.gradle.daemon=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are being used in
# your project.
# visit https://developer.android.com/jetpack/androidx/releases for more info.
android.useAndroidX=true

# Enable the new JSC runtime for Android builds
# This improves JavaScript performance on Android devices
hermesEnabled=true

# Use the bundled Gradle instead of a network-based download
org.gradle.prefer-gradle-wrapper=true
